services:
  - type: web
    name: ena-coach-booking
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ena-coach-bookings-db
          property: connectionString
databases:
  - name: ena-coach-bookings-db
    plan: free
    region: singapore
    databaseName: ena_coach_bookings_db
    user: ena_coach_bookings_db_user
